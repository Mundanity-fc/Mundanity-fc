name: Metrics Update

on:
  schedule:
    - cron: '10 * * * *' # runs at every 12AM UTC

jobs:
  Full-Calendar:
    name: calendar generator
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.calendar.full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0
